services:

  local-postgres:
    image: postgres:17.9
    container_name: local-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    networks:
      - local

  local-pgadmin:
    image: dpage/pgadmin4:9.15.0
    container_name: local-pgadmin
    ports:
      - 5434:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=user@local.com
      - PGADMIN_DEFAULT_PASSWORD=password
    networks:
      - local

  local-seq:
    image: datalust/seq:2025.2
    container_name: local-seq
    ports:
      - "5030:80"
      - "5341:5341"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      - local

  local-keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: local-keycloak
    restart: always
    ports:
      - "8443:8443"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=password
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8443
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/conf/server.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/conf/server.key
    volumes:
      - ./ssl/local.keycloak.crt:/opt/keycloak/conf/server.crt
      - ./ssl/local.keycloak.key:/opt/keycloak/conf/server.key
      - ./keycloak/todolist-realm.json:/opt/keycloak/data/import/todolist-realm.json:ro
    networks:
      - local
    command: [ "start-dev", "--import-realm" ]

  local-azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: local-azurite
    restart: always
    ports:
      - "10000:10000"
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:BA==
    networks:
      - local

networks:
    local: